[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "knowledge-feed"
version = "0.1.0"
description = "A static, AI-assisted personal knowledge feed"
requires-python = ">=3.10"
dependencies = ["Markdown>=3.5", "Jinja2>=3.1"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
